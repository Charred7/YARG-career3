# ═══════════════════════════════════════════════════════════# HypeEngine External Configuration — Priority-Queue Layout# ═══════════════════════════════════════════════════════════# Rules are checked in strict priority-queue order:#   Tier 1 (smallest priority_rank first) → Tier 2 → Tier 3 → ...#   First match wins — no lower-tier rules are evaluated.## Tier structure:#   Tier 1: Campaign proximity & milestones#   Tier 2: Time-efficiency & low-friction hooks#   Tier 3: Icon worship & FOMO triggers#   Tier 4: Stamina mitigation & casual flow#   Tier 5: Structural safety nets & campaign volume#   Tier 0: Fallback (nothing matched in any tier)## icon: Sprite name from HypeIconSet.asset (SVGs in HypeIcons/solo/).#   Available: audio, battery, broom, chart_up, crown, fire, flag, guitar,#              leaf, lightning, megaphone, numbers, pin, radio, rocket,#              running, shield, skateboard, sprout, star, stopwatch,#              sunglasses, ticket, trophy, yoga## Evaluation order: For Tier N, rules are checked from smallest# priority_rank to largest. The first rule whose condition(s) are# satisfied wins and its slot text is displayed. If no rule matches# in Tier N, the engine moves to Tier N+1. If no tier produces a# match, Tier 0 (fallback) is used.# ═══════════════════════════════════════════════════════════
[Global]
guarantee_highest_tier = false
use_only_highest_tier = true

# ═══════════════════════════════════════════════════════════
# Tier 0 — Fallback
# ═══════════════════════════════════════════════════════════
# Final safety net when no other tier matched.
#
# Priority order: FallbackHighVibe > FallbackCrowd
#
# ═══════════════════════════════════════════════════════════# Tier 0 — Fallback# ═══════════════════════════════════════════════════════════# Final safety net when no other tier matched.
[Rule.FallbackHighVibe]
tier = 0
priority_rank = 100
condition = always
operator = eq
value = true
icon = guitar
slot1 = "Setlist Vibe: Pure Rock & Roll"
slot2 = "The volume knobs are pinned. Step up to the stage!"

[Rule.FallbackCrowd]
tier = 0
priority_rank = 200
condition = always
operator = eq
value = true
icon = audio
slot1 = "VENUE SOUND-CHECK: OPTIMAL"
slot2 = "The amps are warm and the stadium is screaming your name."

# ═══════════════════════════════════════════════════════════
# TIER 1 — Campaign Proximity & Milestones
# ═══════════════════════════════════════════════════════════
# Priority order: CampaignFinale > MicroSprint > BlitzPlay > VenueGate > CampaignPenultimate > UnderTenClub
#
# ═══════════════════════════════════════════════════════════# TIER 1 — Campaign Proximity & Milestones# ═══════════════════════════════════════════════════════════# Highest evaluation priority. Rules in this tier are checked# first, in priority_rank order (smallest number first).# Priority order: final showdown > endgame > countdown > drive
[Rule.CampaignFinale]
tier = 1
priority_rank = 5
condition = remaining_gigs_total
operator = eq
value = 1
icon = crown
slot1 = "FINAL BOSS SETLIST UNLOCKS NEXT"
slot2 = "Legends are made right here. Finish the fight!"

# ═══════════════════════════════════════════════════════════# TIER 2 — Time-Efficiency & Low-Friction Hooks# ═══════════════════════════════════════════════════════════# Only fires when Tier 1 didn't match. Reframes the gig# as a quick, low-time-commitment activity.
[Rule.MicroSprint]
tier = 1
priority_rank = 10
condition = total_minutes
operator = lte
value = 6.5
icon = running
slot1 = "THE ULTRA-SPRINT SET"
slot2 = "In and out in under {0} minutes total!"
slot2_param = total_minutes

[Rule.BlitzPlay]
tier = 1
priority_rank = 15
condition = total_minutes
operator = lte
value = 9.0
condition2 = avg_track_minutes
operator2 = lt
value2 = 3.5
icon = lightning
slot1 = "FAST TRACK (Under 9 Mins Total)"
slot2 = "A perfect quick-fire set before hitting the rack."

[Rule.VenueGate]
tier = 1
priority_rank = 20
condition = remaining_gigs_in_tier
operator = eq
value = 1
icon = guitar
slot1 = "VENUE FINALE: ONE MORE TO GO"
slot2 = "Clear this gig to unlock the next tour destination!"

[Rule.CampaignPenultimate]
tier = 1
priority_rank = 25
condition = remaining_gigs_total
operator = eq
value = 2
icon = flag
slot1 = "CLOSING IN ON THE FINISH LINE"
slot2 = "Only {0} more sets left in the entire campaign!"
slot2_param = remaining_gigs_total

[Rule.UnderTenClub]
tier = 1
priority_rank = 30
condition = total_minutes
operator = lt
value = 10.0
icon = stopwatch
slot1 = "SINGLE-DIGIT MARATHON"
slot2 = "Total stage time is under {0} minutes!"
slot2_param = total_minutes

# ═══════════════════════════════════════════════════════════
# TIER 2 — Time-Efficiency & Low-Friction
# ═══════════════════════════════════════════════════════════
# Priority order: HeadlinerFastTrack > BiteSized > EarlyCampaignSprint > PunkRockBlitz > QuickThreeTrack > ComedownSet > SmoothSailing
#
# ═══════════════════════════════════════════════════════════# TIER 3 — Icon Worship & FOMO Triggers# ═══════════════════════════════════════════════════════════# Only fires when Tiers 1-2 didn't match. Exploits# headliner artist presence to create FOMO.
[Rule.HeadlinerFastTrack]
tier = 2
priority_rank = 5
condition = has_headliner_artist
operator = eq
value = true
condition2 = total_minutes
operator2 = lte
value2 = 10.0
icon = star
slot1 = "A STAR-STUDDED FAST TRACK"
slot2 = "Legendary tracks packed into a brief {0} min set!"
slot2_param = total_minutes

[Rule.BiteSized]
tier = 2
priority_rank = 10
condition = total_minutes
operator = gt
value = 9.0
condition2 = avg_track_minutes
operator2 = lt
value2 = 3.0
icon = stopwatch
slot1 = "Avg. Track: ~{0} MINS"
slot1_param = avg_track_minutes
slot2 = "Short, snappy anthems designed for maximum speed."

# ═══════════════════════════════════════════════════════════# TIER 5 — Structural Safety Nets# ═══════════════════════════════════════════════════════════# Only fires when Tiers 1-4 didn't match. Broad-count# proximity and session-volume context.
