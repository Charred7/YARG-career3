tier = 2
priority_rank = 15
condition = remaining_gigs_total
operator = gte
value = 15
condition2 = total_minutes
operator2 = lte
value2 = 9.0
icon = sprout
slot1 = "EARLY TOUR SPRINT"
slot2 = "Knock this quick one out to build up your bank roll!"

[Rule.PunkRockBlitz]
