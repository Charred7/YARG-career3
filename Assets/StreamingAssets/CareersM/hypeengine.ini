priority_rank = 20
condition = avg_track_minutes
operator = lt
value = 2.9
icon = skateboard
slot1 = "PUNK DURATIONS ACTIVATED"
slot2 = "Tracks average a lightning-fast {0} mins!"
slot2_param = avg_track_minutes

[Rule.QuickThreeTrack]
tier = 2
priority_rank = 25
condition = total_minutes
operator = lte
value = 11.0
condition2 = avg_track_minutes
operator2 = lt
value2 = 3.2
icon = lightning
slot1 = "LOW-INVESTMENT ROCKING"
slot2 = "Quick tracks mean a fast trophy payout."

[Rule.ComedownSet]
tier = 2
priority_rank = 30
condition = avg_track_below_campaign_avg
operator = eq
value = true
condition2 = remaining_gigs_in_tier
operator2 = gt
value2 = 1
icon = leaf
slot1 = "PERFECT COOL-DOWN SET"
slot2 = "Cruise through these chart densities with total ease."

# ═══════════════════════════════════════════════════════════# TIER 4 — Stamina Mitigation & Casual Flow# ═══════════════════════════════════════════════════════════# Only fires when Tiers 1-3 didn't match. Reassures the# player that this gig won't strain their hands.
